<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#03040a" />
<title>Solar System · Interactive 3D Orrery</title>
<style>
  :root{
    --glass:rgba(16,20,36,.55);
    --glass-2:rgba(255,255,255,.04);
    --stroke:rgba(255,255,255,.09);
    --stroke-hi:rgba(255,255,255,.22);
    --text:#e8edfb;
    --muted:#8d97b5;
    --accent:#7cc4ff;
    --accent-2:#a98bff;
    --r:18px;
    --blur:saturate(160%) blur(18px);
    --sb:env(safe-area-inset-bottom,0px);
    --st:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#03040a;color:var(--text);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .glass{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
  .ui{position:fixed;z-index:10;transition:opacity .6s ease}
  body.booting .ui,body.booting #labels{opacity:0}
  .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}

  /* Clock */
  #clock{top:calc(16px + var(--st));left:16px;padding:14px 18px 13px;min-width:250px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#5ef0a0;box-shadow:0 0 10px #5ef0a0;transition:background .3s,box-shadow .3s}
  body.paused .live-dot{background:#ffb454;box-shadow:0 0 10px #ffb454}
  #date{font-size:22px;font-weight:650;letter-spacing:-.01em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
  #time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  #viewing{margin-top:10px;padding-top:10px;border-top:1px solid var(--stroke);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:14px}
  #viewing b{color:var(--text);font-weight:600}

  /* Sidebar */
  #side{top:calc(16px + var(--st));right:16px;width:296px;max-height:calc(100% - 170px);display:flex;flex-direction:column;gap:12px}
  #bodies{padding:8px;flex:none}
  .side-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px}
  .pill-btn{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass-2);transition:background .2s,border-color .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .pill-btn:hover{border-color:var(--stroke-hi);background:rgba(255,255,255,.08)}
  .pill-btn.active{border-color:rgba(124,196,255,.55);background:rgba(124,196,255,.15)}
  .pill-btn svg{width:13px;height:13px}
  #body-list{display:flex;flex-direction:column;gap:2px}
  .body-btn{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;text-align:left;width:100%;transition:background .2s,box-shadow .2s}
  .body-btn:hover{background:rgba(255,255,255,.06)}
  .body-btn.active{background:linear-gradient(90deg,rgba(124,196,255,.2),rgba(124,196,255,.04));box-shadow:inset 0 0 0 1px rgba(124,196,255,.38)}
  .swatch{width:11px;height:11px;border-radius:50%;flex:none}
  .body-btn .nm{flex:1;font-weight:550}
  .body-btn .mt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  #info{padding:16px 16px 14px;overflow:auto;min-height:0;scrollbar-width:thin}
  .info-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  #info-name{font-size:21px;font-weight:650;letter-spacing:-.01em;margin-top:3px}
  #info-toggle{display:none;width:32px;height:32px;border-radius:10px;border:1px solid var(--stroke);align-items:center;justify-content:center;flex:none}
  #info-toggle svg{width:16px;height:16px;transition:transform .25s}
  #info-desc{color:#c3cbe3;font-size:13px;margin:8px 0 12px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--glass-2);border:1px solid var(--stroke);border-radius:12px;padding:8px 10px;min-width:0}
  .stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .stat .v{font-size:13.5px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .live-h{margin:14px 0 8px}
  .live-h::after{content:"";flex:1;height:1px;background:var(--stroke)}

  /* Dock */
  #dock{left:50%;bottom:calc(16px + var(--sb));transform:translateX(-50%);width:min(780px,calc(100% - 32px));
    display:flex;align-items:center;gap:16px;padding:12px 16px}
  .play{width:50px;height:50px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0d18;box-shadow:0 6px 20px rgba(124,196,255,.35);transition:transform .15s}
  .play:active{transform:scale(.94)}
  .play svg{width:22px;height:22px;fill:currentColor}
  .speed{flex:1;min-width:0}
  .speed-top,.speed-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
  #speed-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  #speed-sub{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  #chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--stroke);color:var(--muted);transition:.2s;font-variant-numeric:tabular-nums}
  .chip:hover{color:var(--text);border-color:var(--stroke-hi)}
  .chip.active{color:#0a0d18;background:var(--accent);border-color:var(--accent)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;--p:100%;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2) var(--p),rgba(255,255,255,.12) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(124,196,255,.25),0 2px 8px rgba(0,0,0,.45)}
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.12)}
  input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(124,196,255,.25),0 2px 8px rgba(0,0,0,.45)}
  .actions{display:flex;gap:6px;flex:none}
  .icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.2s;background:var(--glass-2)}
  .icon-btn:hover{color:var(--text);border-color:var(--stroke-hi)}
  .icon-btn.on{color:var(--accent);border-color:rgba(124,196,255,.4);background:rgba(124,196,255,.1)}
  .icon-btn svg{width:19px;height:19px}

  /* Labels */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;transition:opacity .4s}
  #labels.hidden{opacity:0}
  #labels.hidden .label{pointer-events:none}
  .label{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;
    padding:3px 9px 3px 7px;font-size:12px;font-weight:550;border-radius:999px;white-space:nowrap;
    background:rgba(10,12,24,.5);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;transition:opacity .25s,border-color .2s,background .2s;will-change:transform}
  .label .swatch{width:7px;height:7px}
  .label:hover{border-color:var(--stroke-hi);background:rgba(20,26,48,.7)}
  .label.active{border-color:rgba(124,196,255,.7);box-shadow:0 0 14px rgba(124,196,255,.25)}

  /* Hint, loader, error */
  #hint{left:16px;bottom:calc(16px + var(--sb));font-size:12px;color:var(--muted);padding:9px 13px;border-radius:12px;max-width:250px}
  #hint.gone{opacity:0;pointer-events:none}
  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at center,#0b0f22 0%,#03040a 70%);transition:opacity .8s ease}
  #loader.done{opacity:0;pointer-events:none}
  .orb{width:54px;height:54px;border-radius:50%;border:2px solid rgba(124,196,255,.15);border-top-color:var(--accent);border-right-color:var(--accent-2);animation:spin 1s linear infinite;position:relative}
  .orb::after{content:"";position:absolute;inset:17px;border-radius:50%;background:radial-gradient(circle,#ffe7a3,#ff9a3c);box-shadow:0 0 22px #ffb24d}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader-text{color:var(--muted);font-size:13px;letter-spacing:.04em}
  #error{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
  #error.show{display:flex}
  #error .glass{padding:22px 26px;max-width:420px}
  #error h3{margin-bottom:8px}
  #error p{color:var(--muted)}

  /* Responsive */
  @media (max-width: 860px){
    #side{width:270px}
    #dock{width:calc(100% - 332px);left:16px;transform:none}
  }
  @media (max-width: 720px){
    #clock{left:10px;right:10px;top:calc(10px + var(--st));min-width:0;padding:10px 14px;display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:12px}
    #clock .eyebrow{grid-column:1/-1}
    #date{font-size:17px;margin-top:3px}
    #time{text-align:right}
    #viewing{display:none}
    #dock{left:10px;right:10px;width:auto;bottom:calc(10px + var(--sb));flex-wrap:wrap;gap:10px;padding:10px 12px}
    .play{width:44px;height:44px}
    .actions{width:100%;justify-content:space-between}
    .icon-btn{flex:1;height:36px}
    #side{left:10px;right:10px;width:auto;top:auto;bottom:calc(var(--dock-h,150px) + 18px + var(--sb));max-height:48vh;gap:8px}
    #bodies{padding:6px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}
    #bodies::-webkit-scrollbar{display:none}
    .side-head{padding:0 4px 0 0}
    .side-head .eyebrow{display:none}
    #body-list{flex-direction:row;gap:4px}
    .body-btn{width:auto;padding:7px 11px;white-space:nowrap}
    .body-btn .mt{display:none}
    #info{padding:12px 14px}
    #info-toggle{display:flex}
    #info.collapsed .info-body{display:none}
    #info.collapsed #info-toggle svg{transform:rotate(180deg)}
    #info-name{font-size:18px}
    #hint{display:none}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body class="booting">
<canvas id="scene" tabindex="0" aria-label="3D solar system view"></canvas>
<div id="labels"></div>

<div id="clock" class="ui glass">
  <div class="eyebrow"><span class="live-dot"></span><span id="state-text">Simulating</span> · UTC</div>
  <div id="date">—</div>
  <div id="time">—</div>
  <div id="viewing"><span>Viewing</span><b id="viewing-name">Solar System</b></div>
</div>

<aside id="side" class="ui">
  <nav id="bodies" class="glass" aria-label="Bodies">
    <div class="side-head">
      <span class="eyebrow">Bodies</span>
      <button class="pill-btn" id="overview-btn" title="System overview (0 / Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Overview
      </button>
    </div>
    <div id="body-list"></div>
  </nav>
  <section id="info" class="glass" aria-live="polite">
    <header class="info-head">
      <div><div class="eyebrow" id="info-type">—</div><h2 id="info-name">—</h2></div>
      <button id="info-toggle" aria-label="Toggle details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </header>
    <div class="info-body">
      <p id="info-desc"></p>
      <div class="stats" id="info-stats"></div>
      <div class="eyebrow live-h">Live</div>
      <div class="stats" id="info-live"></div>
    </div>
  </section>
</aside>

<div id="dock" class="ui glass">
  <button id="play" class="play" aria-label="Pause (Space)" title="Pause / play (Space)"></button>
  <div class="speed">
    <div class="speed-top"><span class="eyebrow">Time speed</span><span id="speed-val">—</span></div>
    <input type="range" id="speed" min="0" max="1000" step="1" value="1000" aria-label="Time acceleration" />
    <div class="speed-bottom"><div id="chips"></div><span id="speed-sub">—</span></div>
  </div>
  <div class="actions">
    <button class="icon-btn" id="btn-today" title="Jump to now (T)" aria-label="Jump to now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
    <button class="icon-btn on" id="tg-orbits" title="Orbit paths (O)" aria-label="Toggle orbit paths"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="9.5" ry="5"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="20.2" cy="10" r="1.4" fill="currentColor"/></svg></button>
    <button class="icon-btn on" id="tg-labels" title="Labels (L)" aria-label="Toggle labels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12V4.5A1.5 1.5 0 0 1 4.5 3H12l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4" fill="currentColor"/></svg></button>
    <button class="icon-btn on" id="tg-belt" title="Asteroid belt (B)" aria-label="Toggle asteroid belt"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="13" r="1.6"/><circle cx="9" cy="9" r="1.2"/><circle cx="12" cy="14" r="1.9"/><circle cx="16" cy="10" r="1.3"/><circle cx="19.5" cy="14" r="1.5"/><circle cx="8" cy="17" r="1"/><circle cx="15.5" cy="17.5" r="1"/></svg></button>
  </div>
</div>

<div id="hint" class="ui glass"></div>

<div id="loader"><div class="orb"></div><div id="loader-text">Loading Three.js…</div></div>
<div id="error"><div class="glass"><h3>Couldn't start the simulation</h3><p id="error-msg">Three.js could not be loaded. Check your internet connection and reload.</p></div></div>

function buildStars() {
  var dot = glowTexture([[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,.85)'], [1, 'rgba(255,255,255,0)']]);

      var x, y, z;
      if (band) {
        var lon = Math.random() * TAU, g = (Math.random() + Math.random() + Math.random() - 1.5) * 0.22;
        x = Math.cos(g) * Math.cos(lon); y = Math.sin(g); z = Math.cos(g) * Math.sin(lon);
        var y2 = y * ct - z * st; z = y * st + z * ct; y = y2;

    eclToScene(h, b.worldPos);
    b.root.position.copy(b.worldPos);
    b.spin.rotation.y = TAU * frac(d * 24 / b.info.rotH);
  }
  var earth = planets[2];
  if (earthClouds) earthClouds.rotation.y = earth.spin.rotation.y + TAU * frac(d / 9);
  // Moon: mean longitude + latitude (low-precision lunar theory) around Earth
  var L = (218.316 + 13.176396 * d) * DEG, F = (93.272 + 13.229350 * d) * DEG, lb = 5.145 * DEG * Math.sin(F);
  moon.position.set(Math.cos(lb) * Math.cos(L) * MOON_DIST, Math.sin(lb) * MOON_DIST, -Math.cos(lb) * Math.sin(L) * MOON_DIST).add(earth.worldPos);
  moon.rotation.y = L + Math.PI;
  belt.rotation.y = BELT_RATE * d;
  sunMesh.rotation.y = TAU * frac(d / 25.38);
}

/* ======================= Camera ======================= */
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function overviewRadius() {
  var hHalf = Math.atan(tanHalf * (W / H));
  return Math.min(900, Math.max(175, 102 / Math.tan(hHalf)));
}
function minRadius() { return focus ? focus.radius * 2.2 : 4; }
function clampR(r) { return Math.max(minRadius(), Math.min(1400, r)); }

function startTransition(toR, dur) {
  cam.transition = { from: cam.target.clone(), fromR: cam.radius, toR: toR, t: 0, dur: dur || 1.6 };
  cam.tRadius = toR;
}
function focusOn(body) {
  focus = body; ui.overview = false;
  startTransition(body.viewDist, 1.6);
  if (cam.tPhi < 0.35 || cam.tPhi > 2.6) cam.tPhi = 1.15;
  onFocusChanged();
}
function focusOverview(dur) {
  focus = sunBody; ui.overview = true;
  startTransition(overviewRadius(), dur || 1.8);
  cam.tPhi = 1.08;
  onFocusChanged();
}

function updateCamera(dt) {
  var k = 1 - Math.exp(-dt * 8);
  cam.theta += (cam.tTheta - cam.theta) * k;
  cam.phi += (cam.tPhi - cam.phi) * k;
  var tr = cam.transition;
  if (tr) {
    tr.t = Math.min(1, tr.t + dt / tr.dur);
    var e = easeInOutCubic(tr.t);
    cam.target.lerpVectors(tr.from, focus ? focus.worldPos : tr.from, e);
    cam.radius = Math.exp(Math.log(tr.fromR) + (Math.log(tr.toR) - Math.log(tr.fromR)) * e);
    if (tr.t >= 1) { cam.transition = null; cam.tRadius = tr.toR; }
  } else {
    if (focus) cam.target.copy(focus.worldPos);
    cam.radius += (cam.tRadius - cam.radius) * k;
  }
  var sp = Math.sin(cam.phi);
  camera.position.set(
    cam.target.x + cam.radius * sp * Math.sin(cam.theta),
    cam.target.y + cam.radius * Math.cos(cam.phi),
    cam.target.z + cam.radius * sp * Math.cos(cam.theta));
  camera.lookAt(cam.target);
}

function rotateBy(dx, dy) {
  cam.tTheta -= dx * 0.0055;
  cam.tPhi = Math.max(0.06, Math.min(Math.PI - 0.06, cam.tPhi - dy * 0.0055));
}
function zoomBy(f) {
  if (cam.transition) cam.transition.toR = clampR(cam.transition.toR * f);
  cam.tRadius = clampR(cam.tRadius * f);
}
function panBy(dx, dy) {
  if (focus || cam.transition) { focus = null; cam.transition = null; ui.overview = false; cam.tRadius = cam.radius; onFocusChanged(); }
  camera.updateMatrix();
  var s = cam.radius * tanHalf * 2 / H;
  tmpA.setFromMatrixColumn(camera.matrix, 0).multiplyScalar(-dx * s);
  tmpB.setFromMatrixColumn(camera.matrix, 1).multiplyScalar(dy * s);
  cam.target.add(tmpA).add(tmpB);
}

/* ======================= Picking ======================= */
function projectedRadius(b) {
  var dist = camera.position.distanceTo(b.worldPos);
  return b.radius / (dist * tanHalf) * (H / 2);
}
function pickAt(x, y) {
  var best = null, bestScore = Infinity;
  for (var i = 0; i < bodies.length; i++) {
    var b = bodies[i];
    v3.copy(b.worldPos).project(camera);
    if (v3.z > 1 || v3.z < -1) continue;
    var sx = (v3.x * 0.5 + 0.5) * W, sy = (-v3.y * 0.5 + 0.5) * H;
    var pr = projectedRadius(b), dd = Math.hypot(sx - x, sy - y);
    if (dd < pr + 24) { var score = Math.max(0, dd - pr); if (score < bestScore) { bestScore = score; best = b; } }
  }
  return best;
}

/* ======================= Controls ======================= */
var pointers = new Map(), drag = null, pinch = null, hoverPos = null, interacted = false;
function pinchState() {
  var p = Array.from(pointers.values());
  return { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2 };
}
function markInteracted() { if (!interacted) { interacted = true; $('hint').classList.add('gone'); } }

function bindControls() {
  var c = renderer.domElement;
  c.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  c.addEventListener('pointerdown', function (e) {
    c.setPointerCapture(e.pointerId); c.focus({ preventScroll: true });
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) drag = { x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: 0, pan: e.button === 2 || e.button === 1 || e.shiftKey };
    else { if (drag) drag.moved = 999; pinch = pinchState(); }
  });
  c.addEventListener('pointermove', function (e) {
    var p = pointers.get(e.pointerId);
    if (!p) { if (e.pointerType === 'mouse') hoverPos = { x: e.clientX, y: e.clientY }; return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1 && drag) {
      drag.moved += Math.abs(dx) + Math.abs(dy);
      if (drag.moved > 4) markInteracted();
      if (drag.pan) panBy(dx, dy); else rotateBy(dx, dy);
    } else if (pointers.size === 2 && pinch) {
      var ps = pinchState();
      zoomBy(pinch.d / ps.d);
      if (!focus) panBy(ps.cx - pinch.cx, ps.cy - pinch.cy);
      pinch = ps; markInteracted();
    }
  });
  function end(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (drag && pointers.size === 0 && drag.moved < 7 && performance.now() - drag.t0 < 500 && e.type === 'pointerup') {
      var b = pickAt(e.clientX, e.clientY);
      if (b) { markInteracted(); b.isSun && focus === sunBody && !ui.overview ? focusOverview() : focusOn(b); }
    }
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) drag = null;
  }
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
  c.addEventListener('pointerleave', function () { hoverPos = null; c.style.cursor = ''; });
  c.addEventListener('wheel', function (e) {
    e.preventDefault(); markInteracted();
    var dy = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    zoomBy(Math.exp(Math.max(-300, Math.min(300, dy)) * 0.0012));
  }, { passive: false });
  c.addEventListener('dblclick', function (e) { var b = pickAt(e.clientX, e.clientY); if (!b) focusOverview(); });

  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT' && e.key !== ' ' && e.key !== 'Escape') return;
    var k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); togglePlay(); }
    else if (k === 'escape' || k === '0') focusOverview();
    else if (k >= '1' && k <= '8') focusOn(planets[+k - 1]);
    else if (k === 's') focusOn(sunBody);
    else if (k === 'o') toggle('orbits');
    else if (k === 'l') toggle('labels');
    else if (k === 'b') toggle('belt');
    else if (k === 't') jumpToNow();
    else if (k === '+' || k === '=') setSliderValue(+$('speed').value + 250);
    else if (k === '-' || k === '_') setSliderValue(+$('speed').value - 250);
    else if (k === 'arrowleft') rotateBy(-40, 0);
    else if (k === 'arrowright') rotateBy(40, 0);
    else if (k === 'arrowup') zoomBy(0.85);
    else if (k === 'arrowdown') zoomBy(1.18);
  });
  window.addEventListener('resize', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
}

function onResize() {
  W = innerWidth; H = innerHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H, false);
  document.documentElement.style.setProperty('--dock-h', $('dock').offsetHeight + 'px');
  if (ui.overview && !cam.transition) cam.tRadius = overviewRadius();
  if (belt) { belt.material.size = W < 720 ? 0.8 : 1.4; belt.material.opacity = W < 720 ? 0.55 : 0.75; }
}

/* ======================= UI ======================= */
var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10.2-6.5a1 1 0 0 0 0-1.7L9.53 4.65A1 1 0 0 0 8 5.5z"/></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>';
var dateFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
var timeFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'UTC' });

function fmtPeriod(days) { return days < 1000 ? nf1.format(days) + ' days' : nf.format(+(days / 365.25).toFixed(2)) + ' years'; }
function fmtDuration(sec) {
  if (sec < 1) return (sec * 1000).toFixed(0) + ' ms';
  if (sec < 60) return nf1.format(sec) + ' s';
  if (sec < 3600) return nf1.format(sec / 60) + ' min';
  if (sec < 86400) return nf1.format(sec / 3600) + ' h';
  if (sec < 86400 * 365.25) return nf1.format(sec / 86400) + ' days';
  return nf1.format(sec / (86400 * 365.25)) + ' years';
}
function fmtSpeed(s) { return s >= 1000 ? nf1.format(s / 1000) + 'k×' : nf.format(s) + '×'; }
function sliderToSpeed(v) { return Math.max(1, Math.round(Math.pow(10, v / 1000 * Math.log10(MAX_SPEED)))); }
function speedToSlider(s) { return Math.round(Math.log10(Math.max(1, s)) / Math.log10(MAX_SPEED) * 1000); }

function buildUI() {
  var list = $('body-list');
  bodies.forEach(function (b) {
    var btn = document.createElement('button');
    btn.className = 'body-btn'; btn.dataset.id = b.id;
    var meta = b.isSun ? 'Star' : fmtPeriod(b.info.el.periodDays);
    btn.innerHTML = '<span class="swatch" style="background:' + b.color + ';box-shadow:0 0 10px ' + b.color + '"></span><span class="nm">' + b.name + '</span><span class="mt">' + meta + '</span>';
    btn.addEventListener('click', function () { focusOn(b); });
    list.appendChild(btn); b.btn = btn;

    var lab = document.createElement('div');
    lab.className = 'label';
    lab.innerHTML = '<span class="swatch" style="background:' + b.color + '"></span>' + b.name;
    lab.addEventListener('click', function () { markInteracted(); focusOn(b); });
    $('labels').appendChild(lab); b.label = lab; b._vis = false;
  });
  $('overview-btn').addEventListener('click', function () { focusOverview(); });

  var chips = $('chips');
  for (var p = 0; p <= Math.log10(MAX_SPEED) + 1e-9; p++) {
    (function (s) {
      var c = document.createElement('button'); c.className = 'chip'; c.textContent = fmtSpeed(s); c.dataset.s = s;
      c.addEventListener('click', function () { setSliderValue(speedToSlider(s)); });
      chips.appendChild(c);
    })(Math.pow(10, p));
  }
  $('speed').addEventListener('input', function () { setSliderValue(+this.value); });
  $('play').addEventListener('click', togglePlay);
  $('btn-today').addEventListener('click', jumpToNow);
  ['orbits', 'labels', 'belt'].forEach(function (k) { $('tg-' + k).addEventListener('click', function () { toggle(k); }); });
  $('info-toggle').addEventListener('click', function () { $('info').classList.toggle('collapsed'); });
  if (matchMedia('(max-width: 720px)').matches) $('info').classList.add('collapsed');

  var touch = matchMedia('(pointer: coarse)').matches;
  $('hint').textContent = touch ? 'Drag to orbit · Pinch to zoom · Tap a planet to follow it'
    : 'Drag to orbit · Scroll to zoom · Right-drag to pan · Click a planet to follow · Space pauses · 1–8 jump to planets';
  setTimeout(markInteracted, 12000);

  setSliderValue(speedToSlider(DEFAULT_SPEED));
  renderPlay();
}

function setSliderValue(v) {
  v = Math.max(0, Math.min(1000, Math.round(v)));
  var s = $('speed'); s.value = v; s.style.setProperty('--p', (v / 10) + '%');
  sim.speed = sliderToSpeed(v);
  $('speed-val').textContent = nf.format(sim.speed) + '×';
  $('speed-sub').textContent = '1 s = ' + fmtDuration(sim.speed) + ' · 1 yr = ' + fmtDuration(365.25 * 86400 / sim.speed);
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) { c.classList.toggle('active', +c.dataset.s === sim.speed); });
}
function togglePlay() { sim.playing = !sim.playing; renderPlay(); }
function renderPlay() {
  var b = $('play');
  b.innerHTML = sim.playing ? ICON_PAUSE : ICON_PLAY;
  b.setAttribute('aria-label', sim.playing ? 'Pause (Space)' : 'Play (Space)');
  document.body.classList.toggle('paused', !sim.playing);
  $('state-text').textContent = sim.playing ? 'Simulating' : 'Paused';
}
function jumpToNow() { sim.ms = Date.now(); }
function toggle(k) {
  ui[k] = !ui[k];
  $('tg-' + k).classList.toggle('on', ui[k]);
  if (k === 'belt') belt.visible = ui.belt;
  if (k === 'labels') $('labels').classList.toggle('hidden', !ui.labels);
  if (k === 'orbits') planets.forEach(function (p) { p.orbit.visible = ui.orbits; });
}

function stat(k, v, id) { return '<div class="stat"><div class="k">' + k + '</div><div class="v"' + (id ? ' id="' + id + '"' : '') + '>' + v + '</div></div>'; }

function onFocusChanged() {
  var name = ui.overview ? 'Solar System' : focus ? focus.name : 'Free camera';
  $('viewing-name').textContent = name;
  bodies.forEach(function (b) {
    var on = !ui.overview && focus === b;
    b.btn.classList.toggle('active', on); b.label.classList.toggle('active', on);
  });
  $('overview-btn').classList.toggle('active', ui.overview);
  if (focus && !ui.overview && focus.btn && focus.btn.scrollIntoView) focus.btn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  renderInfo();
}

function renderInfo() {
  var b = ui.overview || !focus ? null : focus, s = '', live = '';
  if (!b) {
    $('info-type').textContent = 'Overview';
    $('info-name').textContent = 'The Solar System';
    $('info-desc').textContent = 'Planet positions come from real Keplerian orbital elements, so dates, periods and alignments are accurate. Distances are compressed and planet sizes enlarged so everything fits on screen.';
    s = stat('Planets', '8') + stat('Age', '4.6 billion yrs') + stat('Orbits', 'Kepler / JPL J2000') + stat('Scale', 'Distances compressed');
    live = stat('Earth–Sun', '—', 'lv-a') + stat('Earth speed', '—', 'lv-b') + stat('Mars from Earth', '—', 'lv-c') + stat('Jupiter from Earth', '—', 'lv-d');
  } else if (b.isSun) {
    $('info-type').textContent = SUN_INFO.type;
    $('info-name').textContent = 'Sun';
    $('info-desc').textContent = SUN_INFO.desc;
    s = stat('Radius', '696,340 km') + stat('Rotation', '25.4 days (equator)') + stat('Surface', '5,500 °C') + stat('Core', '15 million °C');
    live = stat('Earth distance', '—', 'lv-a') + stat('Light to Earth', '—', 'lv-b');
  } else {
    var p = b.info;
    $('info-type').textContent = p.type;
    $('info-name').textContent = p.name;
    $('info-desc').textContent = p.desc;
    s = stat('Radius', nf.format(p.radiusKm) + ' km') + stat('Year', fmtPeriod(p.el.periodDays)) + stat('Day', p.day) + stat('Axial tilt', nf1.format(p.tilt) + '°')
      + stat('Moons', p.moons) + stat('Temperature', p.temp) + stat('Semi-major axis', p.el.a.toFixed(3) + ' AU') + stat('Eccentricity', p.el.e.toFixed(4));
    live = stat('From Sun', '—', 'lv-a') + stat('Orbital speed', '—', 'lv-b') + stat(p.id === 'earth' ? 'Moon phase' : 'From Earth', '—', 'lv-c') + stat('Sunlight travel', '—', 'lv-d');
  }
  $('info-stats').innerHTML = s;
  $('info-live').innerHTML = live;
  updateLive();
}

function distAU(a, b) { var dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z; return Math.sqrt(dx * dx + dy * dy + dz * dz); }
function fmtAU(au) { return au.toFixed(3) + ' AU · ' + nf1.format(au * AU_KM / 1e6) + 'M km'; }
function orbitalSpeed(b) { return 29.7847 * Math.sqrt(Math.max(0, 2 / b.rAU - 1 / b.info.el.a)); }
function lightTime(au) { var s = au * 499.004784; return s < 3600 ? Math.floor(s / 60) + ' m ' + Math.round(s % 60) + ' s' : (s / 3600).toFixed(2) + ' h'; }
function setText(id, t) { var el = $(id); if (el && el.textContent !== t) el.textContent = t; }
function moonPhase() {
  var d = currentDays();
  var Lm = 218.316 + 13.176396 * d, Ls = 280.460 + 0.9856474 * d;
  var age = frac(((Lm - Ls) % 360 + 360) % 360 / 360);
  var names = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
  var illum = Math.round((1 - Math.cos(age * TAU)) / 2 * 100);
  return names[Math.round(age * 8) % 8] + ' · ' + illum + '%';
}
function updateLive() {
  var earth = planets[2]; if (!earth) return;
  var b = ui.overview || !focus ? null : focus;
  if (!b) {
    setText('lv-a', fmtAU(earth.rAU));
    setText('lv-b', orbitalSpeed(earth).toFixed(2) + ' km/s');
    setText('lv-c', fmtAU(distAU(planets[3].helio, earth.helio)));
    setText('lv-d', fmtAU(distAU(planets[4].helio, earth.helio)));
  } else if (b.isSun) {
    setText('lv-a', fmtAU(earth.rAU));
    setText('lv-b', lightTime(earth.rAU));
  } else {
    setText('lv-a', fmtAU(b.rAU));
    setText('lv-b', orbitalSpeed(b).toFixed(2) + ' km/s');
    setText('lv-c', b.id === 'earth' ? moonPhase() : fmtAU(distAU(b.helio, earth.helio)));
    setText('lv-d', lightTime(b.rAU));
  }
}

var lastDate = '', lastTime = '', lastLive = 0;
function updateHUD(now) {
  var dte = new Date(sim.ms);
  if (isNaN(dte.getTime())) return;
  var ds = dateFmt.format(dte), ts = timeFmt.format(dte);
  if (ds !== lastDate) { $('date').textContent = ds; lastDate = ds; }
  if (ts !== lastTime) { $('time').textContent = ts; lastTime = ts; }
  if (now - lastLive > 200) { lastLive = now; updateLive(); }
}

function updateLabels() {
  if (!ui.labels) return;
  for (var i = 0; i < bodies.length; i++) {
    var b = bodies[i], el = b.label;
    v3.copy(b.worldPos).project(camera);
    if (v3.z > 1 || v3.z < -1) { if (b._vis) { el.style.opacity = '0'; b._vis = false; } continue; }
    var pr = projectedRadius(b);
    var x = (v3.x * 0.5 + 0.5) * W, y = (-v3.y * 0.5 + 0.5) * H - pr - 8;
    el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%,-100%)';
    if (!b._vis) { el.style.opacity = '1'; b._vis = true; }
  }
}

function updateOrbitHighlight(dt) {
  var k = 1 - Math.exp(-dt * 6);
  for (var i = 0; i < planets.length; i++) {
    var p = planets[i], target = (!ui.overview && focus === p) ? 0.6 : 0.2;
    p.orbit.material.opacity += (target - p.orbit.material.opacity) * k;
  }
}

var hoverBody = null;
function updateHover() {
  if (!hoverPos || pointers.size) return;
  var b = pickAt(hoverPos.x, hoverPos.y);
  if (b !== hoverBody) { hoverBody = b; renderer.domElement.style.cursor = b ? 'pointer' : ''; }
}

/* ======================= Main loop ======================= */
var last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  var k = 1 - Math.exp(-dt * 5);
  sim.logSpeed += (Math.log(sim.speed) - sim.logSpeed) * k;
  sim.playFactor += ((sim.playing ? 1 : 0) - sim.playFactor) * (1 - Math.exp(-dt * 9));
  if (!sim.playing && sim.playFactor < 1e-3) sim.playFactor = 0;
  sim.ms += dt * 1000 * Math.exp(sim.logSpeed) * sim.playFactor;

  updateBodies();
  updateCamera(dt);
  updateOrbitHighlight(dt);
  updateLabels();
  updateHover();
  updateHUD(now);
  renderer.render(scene, camera);
}

loadThree(0);
})();
</script>
</body>
</html>
