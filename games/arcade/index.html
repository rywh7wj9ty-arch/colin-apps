<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colin's Arcade</title>
<meta name="theme-color" content="#0d0a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <header><h1>Colin's <span>Arcade</span></h1><p id="greet">Pick a world.</p></header>
  <section id="games" class="grid" aria-label="Games"></section>
  <footer>Tip: each game can also be added to your Home Screen on its own.</footer>
</main>
<div id="boot-error" hidden><p>The arcade didn't load.</p><button onclick="location.reload()">Tap to reload</button></div>
<script>
window.__bootTimer=setTimeout(function(){if(!window.__arcadeOK){document.getElementById('boot-error').hidden=false}},4000);
window.addEventListener('error',function(){if(!window.__arcadeOK)document.getElementById('boot-error').hidden=false});
</script>
<script src="app.js"></script>
</body>
</html>
