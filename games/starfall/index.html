/* Boot watchdog (plain script, runs even if the game's modules fail to load or parse).
   If the game hasn't booted within 8 s, or a script error happens before boot, show "Tap to reload".
   The reload unregisters the service worker, deletes the starfall-* caches and reloads from the network. */
(function () {
  var booted = false, box = null, timer;
  var scopeBase = new URL('./', location.href).href;
  function hardReload() {
    var go = function () { location.reload(); };
    var jobs = [];
    try {

      }));
    } catch (e) { /* ignore */ }
    try {
      if (window.caches) jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.filter(function (k) { return k.indexOf('starfall-') === 0; }).map(function (k) { return caches.delete(k); }));
      }));
    } catch (e) { /* ignore */ }
    Promise.all(jobs).then(go, go); setTimeout(go, 3000);
  }
  function show(msg, force) {
    if ((booted && !force) || box) return;
    box = document.createElement('button');
    box.id = 'booterr'; box.type = 'button'; box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1000;' +
      'max-width:86vw;padding:14px 22px;border-radius:16px;background:rgba(16,22,44,.94);border:1px solid rgba(95,227,255,.4);color:#e8f4ff;' +
      'font:600 16px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent';
    box.innerHTML = 'Starfall didn\u2019t start<br><span style="color:#5fe3ff">Tap to reload</span><small style="display:block;margin-top:6px;font:400 11px/1.3 ui-monospace,Menlo,monospace;opacity:.6;word-break:break-word"></small>';
    box.lastChild.textContent = msg ? String(msg).slice(0, 220) : '';
    box.addEventListener('click', function () { box.firstChild.textContent = 'Reloading\u2026'; hardReload(); });
    (document.body || document.documentElement).appendChild(box);
  }
  function ours(u) { return !u || (u.indexOf(location.origin) === 0 && u.indexOf('/.netlify/') < 0); }
  addEventListener('error', function (e) {
    if (booted) return;
    var t = e.target;
    if (t && t !== window && t.tagName) {          // a resource failed to load: only our own scripts matter
      if (t.tagName === 'SCRIPT' && ours(t.src) && t.src) show('Could not load ' + t.getAttribute('src'));
      return;
    }
    if (ours(e.filename)) show((e.message || 'Script error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));

  timer = setTimeout(function () {
    var l = document.getElementById('loading');

    show(lastRejection || 'Still loading after 8 s');

      if (!tried) { hardReload(); return; } }
    show(msg, true);
  };
  window.__starfallHardReload = hardReload;
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then(reg => {
      // iOS resumes a home-screen app without a navigation, so it never looks for updates by itself: check on resume.
      let lastCheck = Date.now();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && Date.now() - lastCheck > 60000) { lastCheck = Date.now(); reg.update().catch(() => {}); }
      });
    }).catch(() => {});
    // A new version took over this page: reload into it, but only between games (never mid-game, never on first install).
    let pending = false;
    const applyUpdate = () => { if (pending && (!window.__starfallIdle || window.__starfallIdle())) { pending = false; location.reload(); } };
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) { pending = true; applyUpdate(); } });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') applyUpdate(); });
  });
}
</script>
